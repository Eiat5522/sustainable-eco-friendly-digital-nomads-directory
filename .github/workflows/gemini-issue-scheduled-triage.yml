name: '📋 Gemini Scheduled Issue Triage'

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

permissions:
  contents: 'read'
  id-token: 'write'
  issues: 'write'
  statuses: 'write'

jobs:
  triage-issues:
    timeout-minutes: 5
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # ratchet:actions/checkout@v4

      - name: 'Generate GitHub App Token'
        id: 'generate_token'
        if: ${{ vars.APP_ID && secrets.APP_PRIVATE_KEY }}
        uses: 'actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
      - name: 'Find untriaged issues'
        id: 'find_issues'
        env:
          GITHUB_TOKEN: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
          GITHUB_REPOSITORY: '${{ github.repository }}'
          GH_TOKEN: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
        run:
          NO_LABEL_ISSUES="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --search 'is:open is:issue no:label' --json number,title,body)"

          echo '🏷️ Finding issues that need triage...'
          NEED_TRIAGE_ISSUES="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --search 'is:open is:issue label:"status/needs-triage"' --json number,title,body)"

          echo '🔄 Merging and deduplicating issues...'
          ISSUES="$(echo "${NO_LABEL_ISSUES}" "${NEED_TRIAGE_ISSUES}" | jq -c -s 'add | unique_by(.number)')"

          echo '📝 Setting output for GitHub Actions...'
          echo "issues_to_triage=${ISSUES}" >> "${GITHUB_OUTPUT}"

          ISSUE_COUNT="$(echo "${ISSUES}" | jq 'length')"
          echo "✅ Found ${ISSUE_COUNT} issues to triage! 🎯"

      - name: 'Get Repository Labels'
        id: 'get_labels'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea'
        with:
          github-token: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
          script: |-
            const { data: labels } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const labelNames = labels.map(label => label.name);
            core.setOutput('available_labels', labelNames.join(','));
            core.setOutput('available_labels_json', JSON.stringify(labelNames));
            core.info(`Found ${labelNames.length} labels`);
            return labelNames;

      - name: 'Run Gemini Issue Analysis'
      - name: 'Run Gemini Issue Analysis'
        if: ${{ steps.find_issues.outputs.issues_to_triage != '[]' &&
                secrets.GEMINI_API_KEY &&
                vars.GCP_WIF_PROVIDER && vars.GOOGLE_CLOUD_PROJECT &&
                vars.GOOGLE_CLOUD_LOCATION && vars.SERVICE_ACCOUNT_EMAIL }}
        uses: 'google-github-actions/run-gemini-cli@c1a6db1f0a1f7ab3b093f41e6e7c35d4ec82a7c8' # ratchet:google-github-actions/run-gemini-cli@v0
        id: 'gemini_issue_analysis'          
        gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
        with:
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          settings: |-
            {
              "debug": ${{ fromJSON(env.DEBUG || env.ACTIONS_STEP_DEBUG || false) }},
              "maxSessionTurns": 25,
              "coreTools": [
                "run_shell_command(echo)"
              ],
              "telemetry": {
                "enabled": false
              }
            }
prompt: |-
            ## Role

            You are an issue triage assistant. Analyze the GitHub issues and
            identify the most appropriate existing labels to apply.

            ## Steps

            1. Review the available labels (JSON): ${{ steps.get_labels.outputs.available_labels_json || '[]' }}.
            2. Review the issues (JSON): ${{ steps.find_issues.outputs.issues_to_triage || '[]' }}.
            3. For each issue, classify it by the appropriate labels from the available labels.
            4. Output a JSON array of objects, each containing the issue number,
               the labels to set, and a brief explanation.
            
            Example output:
            [
              {
                "issue_number": 123,
                "labels_to_set": ["status/needs-triage", "area/docs"],
                "reason": "Mentions documentation updates and missing examples"
              }
            ]

        name: 'Apply Labels to Issues'
        if: |-
        steps.gemini_issue_analysis.outcome == 'success' &&
        steps.gemini_issue_analysis.outputs.summary &&
        steps.gemini_issue_analysis.outputs.summary != '' &&
        steps.gemini_issue_analysis.outputs.summary != '[]' }}
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea'
        env:
        LABELS_OUTPUT: '${{ steps.gemini_issue_analysis.outputs.summary }}'
        with:
        github-token: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
        // Strip code block markers if present
