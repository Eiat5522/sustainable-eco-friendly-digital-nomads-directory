name: Security Audit

on:
  pull_request:
    paths:
      - 'sanity/**'
      - 'package.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
      - name: Install dependencies
        run: |
          cd sanity
          npm ci
      - name: Run Security Audit
        run: |
          cd sanity
          npm audit --audit-level=high
