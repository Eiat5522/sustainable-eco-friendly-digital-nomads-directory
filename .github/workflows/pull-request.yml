`name: Pull Request Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.x"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Activate pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@8 --activate

      - name: Ensure pnpm is available (fallback)
        run: |
          echo "Checking pnpm..."
          if command -v pnpm >/dev/null 2>&1; then
            echo "pnpm found: $(pnpm --version)"
          else
            echo "pnpm not found after action/setup and corepack; attempting global install as fallback"
            npm install -g pnpm@8
            echo "pnpm version after fallback: $(pnpm --version)"
          fi

      - name: Install dependencies
        run: |
          cd app-next-directory
          pnpm install --frozen-lockfile

      - name: Type check
        run: |
          cd app-next-directory
          pnpm run type-check

      - name: Lint
        run: |
          cd app-next-directory
          pnpm run lint

      - name: Check formatting
        run: |
          cd app-next-directory
          pnpm exec prettier --check "**/*.{ts,tsx,js,jsx,json,md}"

  build:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.x"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Activate pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@8 --activate

      - name: Ensure pnpm is available (fallback)
        run: |
          echo "Checking pnpm..."
          if command -v pnpm >/dev/null 2>&1; then
            echo "pnpm found: $(pnpm --version)"
          else
            echo "pnpm not found after action/setup and corepack; attempting global install as fallback"
            npm install -g pnpm@8
            echo "pnpm version after fallback: $(pnpm --version)"
          fi

      - name: Install dependencies
        run: |
          cd app-next-directory
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          cd app-next-directory
          pnpm run build
