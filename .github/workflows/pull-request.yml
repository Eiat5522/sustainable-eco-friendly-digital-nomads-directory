name: Pull Request Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Ensure pnpm (early)
        run: |
          # Make sure corepack is enabled and pnpm is available early so that
          # later steps (and any actions that expect pnpm) don't fail.
          corepack enable || true
          corepack prepare pnpm@8 --activate || npm install -g pnpm@8
          pnpm --version || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.x"
          # Do not ask setup-node to use a pnpm cache here because
          # setup-node may try to invoke pnpm before we activate it
          # (causes "Unable to locate executable file: pnpm").
          # We'll install/activate pnpm explicitly below and use pnpm for installs.

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Activate pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@8 --activate

      - name: Ensure pnpm is available (fallback)
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found, installing globally"
            npm install -g pnpm@8
          fi
          pnpm --version

      - name: Install dependencies
        run: |
          cd app-next-directory
          pnpm install --frozen-lockfile

      - name: Type check
        run: |
          cd app-next-directory
          pnpm run type-check

      - name: Lint
        run: |
          cd app-next-directory
          pnpm run lint

      - name: Check formatting
        run: |
          cd app-next-directory
          pnpm dlx -- prettier --check "**/*.{ts,tsx,js,jsx,json,md}"

  build:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v3

      - name: Ensure pnpm (early)
        run: |
          # Make sure corepack is enabled and pnpm is available early so that
          # later steps (and any actions that expect pnpm) don't fail.
          corepack enable || true
          corepack prepare pnpm@8 --activate || npm install -g pnpm@8
          pnpm --version || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.x"
          # see note above about pnpm cache

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Activate pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@8 --activate

      - name: Ensure pnpm is available (fallback)
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found, installing globally"
            npm install -g pnpm@8
          fi
          pnpm --version

      - name: Install dependencies
        run: |
          cd app-next-directory
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          cd app-next-directory
          pnpm run build
