# .github/workflows/copilot-setup-steps.yml
name: Setup Copilot Agent Environment

on:
  workflow_dispatch:
  push:
    branches: [main, detail-pages]

jobs:
  setup-copilot-agent-env:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install project dependencies
        run: pnpm install

      - name: Preinstall Copilot Agent tools
        run: |
          pnpm add -g @playwright/mcp@latest
          pnpm add -g @sanity/mcp-server@latest
          pnpm add -g ref-tools-mcp@latest

      # Optionally, run tests or other setup steps
      - name: Run tests
        run: pnpm test