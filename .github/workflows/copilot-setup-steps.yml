name: Setup Copilot Agent Environment

on:
  workflow_dispatch:
  push:
    branches: [main, detail-pages]

jobs:
  setup-copilot-agent-env:
    runs-on: ubuntu-latest

    steps:
      # Upgrade to at least corepack@0.31.0 to avoid
      # `Cannot find matching keyid` error
      # https://github.com/karlhorky/upleveled.io/pull/850#issuecomment-2646349719
      #
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.x'



      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup pnpm global bin directory
        run: pnpm setup
        env:
          SHELL: bash

      - name: Set PNPM_HOME and add to PATH
        run:
          echo "export PNPM_HOME=$HOME/.pnpm-global" >> $GITHUB_ENV
          
      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Preinstall Copilot Agent tools
        run: |
          pnpm add -g @playwright/mcp@latest
          pnpm add -g @sanity/mcp-server@latest
          pnpm add -g ref-tools-mcp@latest

      # Optionally, run tests or other setup steps
      - name: Run tests
        run: pnpm test
