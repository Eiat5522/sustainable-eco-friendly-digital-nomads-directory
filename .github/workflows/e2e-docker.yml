name: E2E (Docker)

on:
  workflow_dispatch:
  push:
    branches:
      - staging/nextjs-16
      - main

jobs:
  e2e-docker:
    name: Run containerized E2E and upload artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU (for multi-arch support)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install docker compose wrapper
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip
          sudo pip3 install docker-compose
          # Provide a docker-compose shim that forwards to the installed binary if needed
          if [ ! -x /usr/local/bin/docker-compose ]; then
            sudo ln -s $(which docker-compose) /usr/local/bin/docker-compose || true
          fi

      - name: Show Docker version
        run: docker --version

      - name: Ensure scripts are executable
        run: |
          chmod +x ./run-e2e-docker.sh || true

      - name: Run E2E Docker script
        env:
          CI: true
        run: |
          set -o pipefail
          ./run-e2e-docker.sh

      - name: Upload test-results artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            app-next-directory/test-results
            app-next-directory/playwright-report
