# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: find-memory-leaks
alias: Detect files that call `ref()` but never `unref()`
language: TypeScript
rule:
  kind: program
  has:
    pattern: ref()
    stopBy: end
  not:
    has:
      pattern: unref()
      stopBy: end
message: ref() was called without any unref(), which likely keeps resources alive
severity: error
