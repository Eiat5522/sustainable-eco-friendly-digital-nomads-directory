ruleDirs:
  - rules

# Language paths for LSP support
# This tells ast-grep where to find source files
languagePaths:
  - language: typescript
    paths:
      - src/**/*.ts
      - src/**/*.tsx
      - app/**/*.ts
      - app/**/*.tsx
      - components/**/*.ts
      - components/**/*.tsx
  - language: javascript
    paths:
      - src/**/*.js
      - src/**/*.jsx
      - app/**/*.js
      - app/**/*.jsx
      - components/**/*.js
      - components/**/*.jsx